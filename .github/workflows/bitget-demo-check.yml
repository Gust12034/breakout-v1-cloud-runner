name: Bitget Classic Demo Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    name: Verify Bitget Classic Demo API without placing orders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_TRADING: 'false'
      TRADING_ENABLED: 'false'
      BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
      BITGET_DEMO_API_SECRET: ${{ secrets.BITGET_DEMO_API_SECRET }}
      BITGET_DEMO_API_PASSPHRASE: ${{ secrets.BITGET_DEMO_API_PASSPHRASE }}
      BITGET_MARGIN_MODE: ${{ vars.BITGET_MARGIN_MODE || 'isolated' }}
      SYMBOLS: 'BTCUSDT'
    steps:
      - name: Checkout deployment wrapper and encrypted payload
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install decryptor dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<50'
      - name: Decrypt runtime into ephemeral runner storage
        env:
          BOT_BUNDLE_PASSPHRASE: ${{ secrets.BOT_BUNDLE_PASSPHRASE }}
        run: python scripts/decrypt_bundle.py --input private_bundle/bot_payload.bin --output "$RUNNER_TEMP/breakout_runtime"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/breakout_runtime/requirements.txt"
      - name: Run offline validation suite
        run: python -m unittest discover -s "$RUNNER_TEMP/breakout_runtime/tests" -v
      - name: Check Bitget Classic Demo API (read only)
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/breakout_runtime/scripts/check_bitget_demo.py" > "$RUNNER_TEMP/bitget_check.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Read-only Bitget check failed (exit $rc). No credential or account detail was printed."
            exit "$rc"
          fi
          echo "Read-only Bitget Demo connectivity check passed. No orders were placed."
