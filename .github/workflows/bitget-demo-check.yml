name: Bitget Classic Demo Read-only Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connectivity:
    name: Verify Bitget Classic Demo API without placing orders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LIVE_TRADING: 'false'
      TRADING_ENABLED: 'false'
      BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
      BITGET_DEMO_API_SECRET: ${{ secrets.BITGET_DEMO_API_SECRET }}
      BITGET_DEMO_API_PASSPHRASE: ${{ secrets.BITGET_DEMO_API_PASSPHRASE }}
      BITGET_MARGIN_MODE: ${{ vars.BITGET_MARGIN_MODE || 'isolated' }}
      SYMBOLS: 'BTCUSDT'
    steps:
      - name: Checkout deployment wrapper and encrypted payload
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install decryptor dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<50'
      - name: Verify encrypted runtime integrity
        shell: bash
        run: |
          if ! echo "3d198082bbb4dd0d46d99031290b318b7175a0088181ab0c76657fe5045afa2b  private_bundle/bot_payload.bin" | sha256sum --check --status; then
            echo "::error::Encrypted runtime payload checksum mismatch. Re-upload the original bot_payload.bin file."
            exit 1
          fi
      - name: Decrypt runtime into ephemeral runner storage
        env:
          BOT_BUNDLE_PASSPHRASE: ${{ secrets.BOT_BUNDLE_PASSPHRASE }}
        run: python scripts/decrypt_bundle.py --input private_bundle/bot_payload.bin --output "$RUNNER_TEMP/breakout_runtime"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/breakout_runtime/requirements.txt"
      - name: Run offline validation suite
        working-directory: ${{ runner.temp }}/breakout_runtime
        run: python -m unittest discover -s tests -v
      - name: Check Bitget Classic Demo API (read only)
        shell: bash
        run: |
          set +e
          python scripts/diagnose_bitget_demo.py "$RUNNER_TEMP/breakout_runtime" > "$RUNNER_TEMP/bitget_check.log" 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::Sanitized Bitget diagnostic"
            python - "$RUNNER_TEMP/bitget_check.log" <<'PY'
          import os, re, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          for name in ("BITGET_DEMO_API_KEY", "BITGET_DEMO_API_SECRET", "BITGET_DEMO_API_PASSPHRASE"):
              value = os.environ.get(name, "")
              if value:
                  raw = raw.replace(value, "[REDACTED]")
          lines = raw.splitlines()
          safe = []
          for line in lines:
              if any(tag in line for tag in ("ACCESS-KEY", "ACCESS-SIGN", "ACCESS-PASSPHRASE", "secret", "passphrase", "api_key", "api_secret")):
                  line = re.sub(r"(?i)(ACCESS-KEY|ACCESS-SIGN|ACCESS-PASSPHRASE|api[_-]?key|api[_-]?secret|passphrase)(\\s*[=:]\\s*)[^,; ]+", r"\\1\\2[REDACTED]", line)
              if line.startswith(("[PASS]", "[FAIL]")):
                  safe.append(line[:700])
          if safe:
              for line in safe[-8:]:
                  print(line)
          else:
              print("No safe diagnostic line found. Check GitHub Actions step setup and encrypted runtime.")
          print("Credential values and full traceback were intentionally omitted.")
          PY
            echo "::endgroup::"
            echo "::error::Read-only Bitget check failed (exit $rc). Review the sanitized diagnostic above."
            exit "$rc"
          fi
          echo "Read-only Bitget Demo connectivity check passed. No orders were placed."
