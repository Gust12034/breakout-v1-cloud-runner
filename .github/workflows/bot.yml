name: Breakout V1 Dynamic Bitget Classic Demo Bot

on:
  workflow_dispatch:

permissions:
  contents: read

# The Apps Script scheduler checks active runs before dispatching. This shared
# concurrency group is a second safety barrier against overlapping state writes.
concurrency:
  group: breakout-v1d-bitget-classic-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trade:
    name: Evaluate V1 Dynamic strategy (Bitget Classic Demo only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'false' }}
      PYTHONUNBUFFERED: '1'
      LIVE_TRADING: 'false'
      BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
      BITGET_DEMO_API_SECRET: ${{ secrets.BITGET_DEMO_API_SECRET }}
      BITGET_DEMO_API_PASSPHRASE: ${{ secrets.BITGET_DEMO_API_PASSPHRASE }}
      BITGET_MARGIN_MODE: ${{ vars.BITGET_MARGIN_MODE || 'isolated' }}
      GOOGLE_APPS_SCRIPT_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_URL }}
      CONTROL_PLANE_TOKEN: ${{ secrets.CONTROL_PLANE_TOKEN }}
      SYMBOLS: ${{ vars.TRADE_SYMBOLS || vars.SYMBOLS || 'BTCUSDT' }}
      TRADE_SYMBOLS: ${{ vars.TRADE_SYMBOLS || vars.SYMBOLS || 'BTCUSDT' }}
      SIGNAL_DATA_SOURCE: 'bitget_linear'
      LEN_N: ${{ vars.LEN_N || '48' }}
      VOL_MULT: ${{ vars.V1D_VOL_MULT || '1.5' }}
      ADX_MAX: ${{ vars.V1D_ADX_MAX || '0.0' }}
      ENABLE_LONGS: ${{ vars.ENABLE_LONGS || 'true' }}
      ENABLE_SHORTS: ${{ vars.ENABLE_SHORTS || 'true' }}
      ATR_K: ${{ vars.ATR_K || '2.5' }}
      EXIT_MODE: ${{ vars.V1D_EXIT_MODE || 'Chandelier + BE' }}
      BE_AT: ${{ vars.V1D_BE_AT || '1.0' }}
      TRAIL_M: ${{ vars.V1D_TRAIL_M || '4.0' }}
      DON_M: ${{ vars.V1D_DON_M || '20' }}
      RR: ${{ vars.RR || '2.0' }}
      ANALYZE_TOP_COINS: ${{ vars.ANALYZE_TOP_COINS || 'true' }}
      TRADE_TOP_COINS: ${{ vars.TRADE_TOP_COINS || 'true' }}
      TOP_COINS_COUNT: ${{ vars.TOP_COINS_COUNT || '100' }}
      ALLOW_POSITION_RECOVERY: ${{ vars.ALLOW_POSITION_RECOVERY || 'false' }}
      SYMBOL_PROCESS_DELAY_SEC: '0.12'
    steps:
      - name: Checkout deployment wrapper and encrypted payload
        uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Apps Script reporting code and workflow safety
        run: |
          node --check < google-apps-script/Code.gs
          node scripts/test_apps_script.js
          python -m py_compile scripts/sanitize_runner_log.py scripts/verify_report.py scripts/test_workflow_safety.py scripts/test_log_sanitizer.py
          python scripts/test_log_sanitizer.py
          python scripts/test_workflow_safety.py
      - name: Validate Demo order-entry switch
        shell: bash
        run: |
          case "$TRADING_ENABLED" in
            true)
              echo "[INFO] Demo order entry is enabled by the TRADING_ENABLED repository variable."
              ;;
            false)
              echo "[INFO] Demo order entry is disabled."
              ;;
            *)
              echo "::error::TRADING_ENABLED must be exactly 'true' or 'false'."
              exit 1
              ;;
          esac
          if [ "$LIVE_TRADING" != "false" ]; then
            echo "::error::LIVE_TRADING must remain false. Mainnet is not supported."
            exit 1
          fi
      - name: Install decryptor dependency
        run: python -m pip install --disable-pip-version-check 'cryptography>=42,<50'
      - name: Verify encrypted runtime integrity
        shell: bash
        run: |
          if ! (cd private_bundle && sha256sum --check --status PAYLOAD_SHA256.txt); then
            echo "::error::Encrypted runtime payload checksum mismatch. Re-upload the original bot_payload.bin file."
            exit 1
          fi
      - name: Decrypt runtime into ephemeral runner storage
        id: decrypt_runtime
        env:
          BOT_BUNDLE_PASSPHRASE: ${{ secrets.BOT_BUNDLE_PASSPHRASE }}
        run: python scripts/decrypt_bundle.py --input private_bundle/bot_payload.bin --output "$RUNNER_TEMP/breakout_runtime"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/breakout_runtime/requirements.txt"
      - name: Run offline validation suite
        working-directory: ${{ runner.temp }}/breakout_runtime
        run: python -m unittest discover -s tests -v
      - name: Verify Google Apps Script control-plane access (read-only)
        shell: bash
        run: |
          python - "$RUNNER_TEMP/breakout_runtime" <<'PY'
          import re
          import sys

          sys.path.insert(0, sys.argv[1])
          try:
              from control_plane import ControlPlane
              state = ControlPlane().get_state()
              if not isinstance(state, dict):
                  raise RuntimeError("state response was not an object")
              print("[PASS] Google Apps Script control-plane read succeeded.")
          except Exception as exc:
              message = str(exc).lower()
              status = re.search(r"\b(401|403|404|408|429|500|502|503|504)\b", message)
              if "unauthorized" in message:
                  reason = "Apps Script rejected CONTROL_PLANE_TOKEN; compare it with the project's Script Property."
              elif status:
                  code = status.group(1)
                  reasons = {
                      "401": "HTTP 401: authentication failed.",
                      "403": "HTTP 403: web-app access denied; verify deployment access settings.",
                      "404": "HTTP 404: GOOGLE_APPS_SCRIPT_URL may point to an old or invalid deployment.",
                      "408": "HTTP 408: Apps Script request timed out.",
                      "429": "HTTP 429: Apps Script quota/rate limit reached.",
                      "500": "HTTP 500: Apps Script threw an internal error; inspect Apps Script Executions.",
                      "502": "HTTP 502: Google service/proxy error.",
                      "503": "HTTP 503: Apps Script temporarily unavailable.",
                      "504": "HTTP 504: gateway timeout.",
                  }
                  reason = reasons.get(code, "HTTP " + code + ": Apps Script request failed.")
              elif "spreadsheet" in message or "spreadsheet_id" in message:
                  reason = "Spreadsheet configuration/access failed; verify SPREADSHEET_ID and the bound spreadsheet."
              elif "google_apps_script_url" in message or "control_plane_token" in message:
                  reason = "Required Script URL or control-plane token is missing/invalid in GitHub Actions Secrets."
              elif "google apps script application error" in message:
                  if "unexpected headers in sheet events" in message:
                      reason = "Apps Script cannot append the final report because the Events sheet header row differs from the expected schema."
                  elif "unexpected headers in sheet positions" in message:
                      reason = "Apps Script cannot update the final report because the Positions sheet header row differs from the expected schema."
                  elif "cell-size limit" in message or "50000" in message or "50,000" in message:
                      reason = "Apps Script rejected an oversized Google Sheets cell; report payload compaction has been enabled."
                  elif "lock" in message or "timed out" in message:
                      reason = "Apps Script could not acquire its report lock in time; another script execution may be overlapping."
                  elif "spreadsheet" in message:
                      reason = "Apps Script could not write the final report to the configured spreadsheet; inspect Apps Script Executions."
                  else:
                      reason = "Apps Script rejected the final report while writing state/events; inspect the Apps Script execution error."
              elif "returned non-json" in message or "json" in message or "invalid response" in message:
                  reason = "Apps Script returned non-JSON or a malformed response; verify the /exec deployment and its execution log."
              elif "transport failed" in message or "request failed" in message:
                  reason = "Network/transport failure while contacting Apps Script."
              else:
                  reason = "Control-plane initialization/read failed (" + type(exc).__name__ + "); detailed data withheld."
              print("[FAIL] " + reason)
              sys.exit(1)
          PY
      - name: Run strategy in Bitget Classic Demo only
        id: run_strategy
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/breakout_runtime/runner.py" > "$RUNNER_TEMP/breakout_runner.log" 2>&1
          rc=$?
          echo "runner_exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "Runner process exited with code $rc; sanitized diagnostics will be published below."

      - name: Publish sanitized runtime diagnostics
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/breakout_runner.log" ]; then
            python scripts/sanitize_runner_log.py \
              --input "$RUNNER_TEMP/breakout_runner.log" \
              --output "$RUNNER_TEMP/breakout_runner.sanitized.log" \
              --emit
          else
            printf '%s\n' '[LOG] Bot runner did not create a log file.' > "$RUNNER_TEMP/breakout_runner.sanitized.log"
            cat "$RUNNER_TEMP/breakout_runner.sanitized.log"
          fi

      - name: Upload sanitized runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: breakout-bot-sanitized-log-${{ github.run_id }}
          path: ${{ runner.temp }}/breakout_runner.sanitized.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify persisted report and safety state
        if: always() && steps.decrypt_runtime.outcome == 'success'
        env:
          RUNNER_EXIT_CODE: ${{ steps.run_strategy.outputs.runner_exit_code || '999' }}
        run: |
          python scripts/verify_report.py \
            --runtime-root "$RUNNER_TEMP/breakout_runtime" \
            --expected-mode four_hour_analysis_and_execution
